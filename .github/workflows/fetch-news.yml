# Saves a daily news snapshot (data/news/YYYY-MM-DD.json) and commits it.
# It runs at midnight New York time (05:00 UTC), because AAPL is a US stock and a
# snapshot should hold one US day of news. The file is named after the New York
# day that has just ended (see scripts/fetch-news.mjs).
# It only reads Google News RSS. It does not call Groq and needs no API key.

name: Fetch news

on:
  schedule:
    - cron: "0 5 * * *" # every day at 05:00 UTC = midnight in New York (1 a.m. in summer)
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write # needed to push the new snapshot file

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script uses only Node's built-in modules, so no `npm install` is needed.
      # If it fails, the job stops here and nothing is committed.
      - name: Fetch news
        run: npm run fetch-news

      - name: Commit and push the snapshot if there is a new one
        run: |
          git add data/news
          if git diff --cached --quiet; then
            echo "No new snapshot file. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add news snapshot"
          git push
