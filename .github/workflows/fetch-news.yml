# Collects one day of news from the 10 RSS feeds in data/sources.json with the
# rule in data/rules.json (scripts/collect.mjs) and commits the snapshot.
# It runs at midnight New York time (05:00 UTC), because AAPL is a US stock and a
# snapshot should hold one US day of news. The file is named after the New York
# day that has just ended.
# The dataset is fixed to the New York days 2026-11-16 and 2026-11-17. On later
# days the script prints a message and does nothing, so nothing is committed.
# It does not call Groq and needs no API key.

name: Fetch news

# The daily schedule is switched off (16 Nov 2026) while the collector is being
# rebuilt. Only a manual run from the Actions tab is possible. To switch it back
# on, add again under "on:":
#   schedule:
#     - cron: "0 5 * * *" # every day at 05:00 UTC = midnight in New York
on:
  workflow_dispatch: # manual run from the Actions tab only

permissions:
  contents: write # needed to push the new snapshot file

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # every article page is opened once, with a pause between them
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The collector needs @mozilla/readability and jsdom to make the excerpts.
      - name: Install packages
        run: npm ci

      # If it fails, the job stops here and nothing is committed.
      - name: Collect news
        run: npm run fetch-news

      - name: Commit and push the snapshot if there is a new one
        run: |
          git add data/news
          if git diff --cached --quiet; then
            echo "No new snapshot file. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add news snapshot"
          git push
