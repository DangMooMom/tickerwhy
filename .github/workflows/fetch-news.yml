# Runs the news collector (scripts/collect.mjs) and commits the result.
# It reads the 35 RSS sources in data/sources.json, scores each item with the rule
# in data/rules.json and data/entities.json, and saves the articles of the last
# 7 days to data/news/dev.json. Each collected article page is opened once for
# an excerpt, at most one request every 3 seconds to the same site.
# It does not call Groq and needs no API key.

name: Fetch news

# The daily schedule is switched off (16 Nov 2026) while the collector is being
# rebuilt. Only a manual run from the Actions tab is possible. To switch it back
# on, add again under "on:":
#   schedule:
#     - cron: "0 5 * * *" # every day at 05:00 UTC = midnight in New York
on:
  workflow_dispatch: # manual run from the Actions tab only

permissions:
  contents: write # needed to push the new snapshot file

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # every article page is opened once, with a pause between them
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The collector needs @mozilla/readability and jsdom to make the excerpts.
      - name: Install packages
        run: npm ci

      # If it fails, the job stops here and nothing is committed.
      - name: Collect news
        run: npm run fetch-news

      - name: Commit and push the snapshot if there is a new one
        run: |
          git add data/news
          if git diff --cached --quiet; then
            echo "No new snapshot file. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add news snapshot"
          git push
